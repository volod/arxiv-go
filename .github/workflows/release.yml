name: release

on:
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache-dependency-path: go.mod
      - name: Required checks
        run: make ci
      - name: Check the tag names the VERSION file
        run: |
          version=$(tr -d '[:space:]' < VERSION)
          if [ "$GITHUB_REF_NAME" != "v$version" ]; then
            echo "tag $GITHUB_REF_NAME does not match VERSION $version (expected v$version)" >&2
            exit 1
          fi
      - name: Build and verify release bundles
        run: |
          make dist
          (cd dist && sha256sum -c SHA256SUMS)
      - name: Publish tag release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" dist/arxgo-*.tar.gz dist/arxgo-*.zip dist/SHA256SUMS --generate-notes
